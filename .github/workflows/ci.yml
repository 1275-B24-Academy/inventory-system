name: CI

on:
  pull_request:
  push:
    branches: [main]

# Huỷ run cũ khi push thêm commit mới vào cùng branch/PR -> tiết kiệm phút CI
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & format (${{ matrix.package }})
    runs-on: ubuntu-latest # Linux = hệ số phút x1 (macOS x10, Windows x2)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [client, server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Smoke check (server)
        if: matrix.package == 'server'
        run: npm run check

  build-client:
    name: Build (client)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run build
